/**:
  ros__parameters:
    control_rate: 10.0        # Control loop execution rate (Hz)
    speed_setpoint: 1.0       # Desired vehicle speed (m/s)
    left_scan_sector: 15.0    # Left laserscan sector (degrees)
    left_scan_offset: 15.0    # Left laserscan upward offset (degrees)
    right_scan_sector: 15.0   # Right laserscan sector (degrees)
    right_scan_offset: 15.0   # Right laserscan upward offset (degrees)
    pid_controller_kp: 0.5    # Wall-following PID controller proportional gain
    pid_controller_ki: 0.01   # Wall-following PID controller integral gain
    pid_controller_kd: 0.02   # Wall-following PID controller derivative gain
    perception_verbose: true  # Verbose perception output (boolean)
    control_verbose: true     # Verbose control output (boolean)